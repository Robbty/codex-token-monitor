<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Codex Token Monitor</title>
  <link rel="stylesheet" href="/static/app.css" />
  <script src="/static/marked.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__title">Codex Sessions</div>
    <div class="topbar__meta">
      <span id="count">0 aktiv</span>
      <span id="cwd" title="Beobachtetes Projektverzeichnis"></span>
      <label class="toggle"
             title="Hintergrund-Worker der Codex Desktop App einblenden (sie verbrauchen Token, melden aber kein Kontextfenster)">
        <input type="checkbox" id="show-workers" />
        <span class="toggle__slider"></span>
        <span class="toggle__label">Worker</span>
      </label>
      <button id="help-btn" class="help-btn" title="Bedienungsanleitung anzeigen">📖</button>
      <span id="conn" class="conn conn--disconnected" title="Verbindung zum Server">●</span>
    </div>
  </header>


  <main id="sessions" class="sessions"></main>

  <section id="empty" class="empty hidden">
    <p>Keine aktiven Codex-Sessions in diesem Verzeichnis.</p>
    <p class="empty__hint">Sobald du <code>codex</code> startest, taucht sie hier auf.</p>
  </section>

  <template id="row-template">
    <article class="session">
      <div class="bar" title="">
        <div class="bar__fill"></div>
        <div class="bar__label">
          <span class="free"></span>&nbsp;/&nbsp;<span class="pctfree"></span>%&nbsp;frei
        </div>
      </div>
      <div class="meta">
        <div class="meta__line meta__line--top">
          <span class="cwd" title=""></span>
          <span class="status status--unknown" title="Lifecycle-Status">●</span>
          <span class="idle" title="Seit letzter Aktivität"></span>
        </div>
        <div class="meta__line meta__line--bottom">
          <span class="sid" title="Klicken zum Kopieren der vollständigen Session-ID"></span>
          <span class="dot">·</span>
          <span class="usage" title="Tokens im aktuellen Kontext / Kontextfenster"></span>
          <span class="dot">·</span>
          <span class="cumulative" title="Kumulierter Token-Verbrauch der gesamten Session"></span>
          <span class="actions">
            <button class="btn btn--open" title="Verzeichnis im Dateimanager öffnen">📁</button>
            <button class="btn btn--focus" title="Terminal/IDE-Fenster zu diesem Verzeichnis nach vorne holen (per wmctrl)">⚡</button>
            <button class="btn btn--path" title="Pfad zur Rollout-Datei (~/.codex/sessions/…) in die Zwischenablage kopieren">📋</button>
            <button class="btn btn--rollover" title="Handover-Prompt für sauberen Session-Rollover in die Zwischenablage kopieren">↻</button>
          </span>
        </div>
      </div>
    </article>
  </template>

  <script src="/static/app.js" defer></script>
</body>
</html>
