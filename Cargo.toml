[package]
name = "codex-token-monitor"
version = "0.1.0"
edition = "2024"
description = "Stdout token/context monitor for the currently active Codex session"
license = "MIT"

[[bin]]
name = "codex-tokens"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
strip = true
